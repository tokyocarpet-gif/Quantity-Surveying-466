name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/e2e.mjs
      - run: node scripts/material-keyboard-e2e.mjs
      - run: node scripts/wall-length-e2e.mjs
      - run: node scripts/wall-line-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
      - run: npm run build:win
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: sekisan-kanri-windows
          path: dist/*.exe
